# Cross-platform shadow projects: builds and tests the shared core, and builds the app, on Windows, Linux and macOS.
# Upstream-merge verification runs on schedule and on demand against upstream/master.
name: xplat

on:
  push:
    branches: [ "xplat/**" ]
  pull_request:
    branches: [ "xplat/**" ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test shadow projects
        run: bash tests/xplat/run-tests.sh

      - name: Test app core (no UI)
        run: dotnet test tests/xplat/GitExtensions.Xplat.Core.Tests -nologo -v:m -p:ArtifactsDir="$RUNNER_TEMP/xplat-core/"

      - name: Test app (headless)
        run: dotnet test tests/xplat/GitExtensions.Xplat.App.Tests -nologo -v:m -p:ArtifactsDir="$RUNNER_TEMP/xplat-app/"

  app-screenshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Launch app on the repository and save a screenshot
        env:
          XPLAT_SCREENSHOT: ${{ runner.temp }}/app-screenshot.png
        run: |
          run_app() {
            dotnet run --project src/xplat/GitExtensions.Xplat.App -p:ArtifactsDir="$RUNNER_TEMP/xplat-app-run/" -- "$GITHUB_WORKSPACE"
          }
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a bash -c "$(declare -f run_app); run_app"; else run_app; fi

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot-${{ matrix.os }}
          path: ${{ runner.temp }}/app-screenshot.png

      # Revision graph target (PLAN.md M3.5): load 5000 commits and scroll them; the frame times go to an artifact.
      # CI runners have no GPU and Linux uses xvfb, so the numbers are a lower bound, not the desktop figure.
      - name: Revision graph benchmark
        env:
          XPLAT_BENCHMARK: ${{ runner.temp }}/graph-benchmark.txt
        run: |
          bash tests/xplat/make-bench-repo.sh "$RUNNER_TEMP/bench-repo"
          run_bench() {
            dotnet run --project src/xplat/GitExtensions.Xplat.App -p:ArtifactsDir="$RUNNER_TEMP/xplat-app-run/" -- "$RUNNER_TEMP/bench-repo"
          }
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a bash -c "$(declare -f run_bench); run_bench"; else run_bench; fi
          cat "$XPLAT_BENCHMARK"

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: graph-benchmark-${{ matrix.os }}
          path: ${{ runner.temp }}/graph-benchmark.txt

  # Self-contained app packages (PLAN.md M7, first step): unsigned, for testing on each OS.
  app-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish and pack
        run: bash src/xplat/eng/publish-app.sh ${{ matrix.rid }} "$RUNNER_TEMP/xplat-publish"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gitextensions-xplat-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/xplat-publish/*.zip
            ${{ runner.temp }}/xplat-publish/*.tar.gz

  upstream-merge-check:
    # Only meaningful on the fork: needs the upstream remote, which is added here.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/gitextensions/gitextensions.git

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify shadow projects against upstream/master
        run: bash tests/xplat/verify-upstream.sh

      - name: Fetch upstream/master for drift checks
        run: git fetch --no-tags upstream master

      - name: Ported forms changed upstream
        run: bash tests/xplat/port-drift.sh

      - name: Mirrored tests changed upstream
        run: bash tests/xplat/xplat-drift.sh
