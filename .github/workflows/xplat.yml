# Cross-platform shadow projects: builds and tests the shared core, and builds the app, on Windows, Linux and macOS.
# Upstream-merge verification runs on schedule and on demand against upstream/master.
name: xplat

on:
  push:
    branches: [ "xplat/**" ]
  pull_request:
    branches: [ "xplat/**" ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test shadow projects
        run: bash tests/xplat/run-tests.sh

      - name: Build app
        run: dotnet build src/xplat/GitExtensions.Xplat.App -nologo -v:m -p:ArtifactsDir="$RUNNER_TEMP/xplat-app/"

  upstream-merge-check:
    # Only meaningful on the fork: needs the upstream remote, which is added here.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/gitextensions/gitextensions.git

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify shadow projects against upstream/master
        run: bash tests/xplat/verify-upstream.sh
